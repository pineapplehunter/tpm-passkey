[package]
name = "tpm-passkey-approval-gtk"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
adw = { version = "0.8", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5"
color-eyre = "0.6.5"
futures-util = "0.3"
gtk = { package = "gtk4", version = "0.10", default-features = false }
tokio = { version = "1.52.3", features = ["macros", "rt", "time", "sync"] }
tpm-passkey-protocol = { path = "../protocol" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-general-category = "1.1.0"
zbus = { version = "5", features = ["tokio"], default-features = false }
