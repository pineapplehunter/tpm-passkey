[package]
name = "tpm-passkey-protocol"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
ciborium = "0.2.2"
zeroize = { version = "1.8", features = ["serde"] }
zbus = { version = "5", features = ["tokio"], default-features = false }
color-eyre = "0.6.5"
libc = "0.2.191"
tokio = { version = "1.52.3", features = ["macros", "net", "rt", "time"] }
