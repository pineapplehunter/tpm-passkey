<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="io.github.pineapplehunter.TpmPasskey1"/>
    <!-- Authorization belongs to the daemon/polkit, not caller-provided data. -->
    <allow send_destination="io.github.pineapplehunter.TpmPasskey1"
           send_interface="io.github.pineapplehunter.TpmPasskey1"/>
    <allow send_destination="io.github.pineapplehunter.TpmPasskey1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.pineapplehunter.TpmPasskey1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <!-- Desktop peers cannot impersonate the root daemon to an agent. -->
    <deny send_interface="io.github.pineapplehunter.TpmPasskey1.ApprovalAgent"/>
  </policy>
  <policy user="root">
    <allow own="io.github.pineapplehunter.TpmPasskey1"/>
    <allow send_interface="io.github.pineapplehunter.TpmPasskey1.ApprovalAgent"/>
  </policy>
</busconfig>
